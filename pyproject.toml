[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickleballos"
version = "0.1.0"
description = "Low-cost, privacy-first pickleball analytics and ranking from a fixed camera"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "onnxruntime>=1.17",
    "tqdm>=4.60",
]

# rtmlib lists opencv-contrib-python as a dependency, which clashes with opencv-python (both
# provide cv2). Install it without deps: pip install --no-deps rtmlib

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pbos = "pbos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
