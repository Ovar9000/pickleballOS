[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickleballos"
version = "0.1.0"
description = "Low-cost, privacy-first pickleball analytics and ranking from a fixed camera"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "tqdm>=4.60",
    "onnx>=1.15",  # strip_nms edits detector graphs
]

# rtmlib lists opencv-contrib-python as a dependency, which clashes with opencv-python (both
# provide cv2). Install it without deps: pip install --no-deps rtmlib

[project.optional-dependencies]
dev = ["pytest>=7"]
# Pick exactly one ONNX Runtime build; they install the same module and overwrite each other.
cpu = ["onnxruntime>=1.17"]
# NVIDIA GPUs. The extras pull the CUDA + cuDNN runtimes as pip wheels; only the NVIDIA driver is needed.
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]

[project.scripts]
pbos = "pbos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
